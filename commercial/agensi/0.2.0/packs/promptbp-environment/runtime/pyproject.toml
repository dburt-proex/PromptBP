[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbp"
version = "0.1.0"
description = "Structural validator for PromptBP seven-layer prompt YAML"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[tool.setuptools]
packages = ["promptbp"]
