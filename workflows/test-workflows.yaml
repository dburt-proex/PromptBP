## Workflow 5: Strategy

**Intent**: Evaluate options and recommend a strategic direction.

```yaml
workflow:
  name: strategy_evaluation
  intent_type: strategy
  complexity: critical
  risk_level: high

  sequence:
    - intent_router
    - context_broker
    - constraint_resolver
    - research_retrieval
    - simulation_layer
    - reasoning_engine
    - risk_scanner
    - validation_engine
    - compression_engine
    - scoring_engine
    - delivery_formatter

  sample_input:
    objective: "Evaluate build vs buy for internal LLM evaluation platform"
    context:
      options:
        - "Build custom evaluation framework"
        - "Adopt open-source framework (LangSmith, Braintrust)"
        - "Use provider-native evaluation (OpenAI Evals)"
      constraints:
        - "Budget: $50k first year"
        - "Team: 2 engineers"
        - "Timeline: production in 8 weeks"
        - "Must support custom scoring rubrics"
      priorities:
        - "Speed to production"
        - "Customizability"
        - "Long-term maintainability"

  acceptance_criteria:
    - "All three options evaluated with pros/cons"
    - "Evaluation uses stated priorities as criteria"
    - "Recommendation is clear and justified"
    - "Risk for each option identified"
    - "Implementation roadmap for recommended option"
    - "Decision is reversibility-aware"
    - "Assumptions made are stated"

  expected_scores:
    correctness: ">= 75"
    completeness: ">= 85"
    utility: ">= 90"
    risk: "<= 50"
    token_efficiency: ">= 55"
    confidence: ">= 70"
```

---

## Running Test Workflows

1. Initialize a state object from the sample input
2. Run the workflow sequence capability by capability
3. Score the final output
4. Compare scores against expected thresholds
5. Record results in the evaluation store
6. Flag any workflow where actual scores deviate >15 points from expected
