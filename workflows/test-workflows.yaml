# Test Workflows

## Purpose

Reference workflows for testing the capability mesh end-to-end. Each workflow defines the intent, expected capability sequence, sample inputs, and acceptance criteria.

---

## Workflow 1: Prompt Audit

**Intent**: Evaluate an existing prompt for quality and suggest improvements.

```yaml
workflow:
  name: prompt_audit
  intent_type: audit
  complexity: medium
  risk_level: low

  sequence:
    - intent_router
    - context_broker
    - reasoning_engine
    - risk_scanner
    - validation_engine
    - compression_engine
    - scoring_engine
    - delivery_formatter

  sample_input:
    objective: "Audit the Content Builder prompt for quality gaps"
    context:
      prompt_to_audit: "schemas/prompt.sample.yaml"
      evaluation_criteria: "PromptBP seven-layer framework"

  acceptance_criteria:
    - "Each of the 7 layers is evaluated independently"
    - "Specific weaknesses are identified with evidence"
    - "Improvement suggestions are actionable"
    - "Overall pass/revise/reject verdict is provided"
    - "Risk of deploying current version is assessed"

  expected_scores:
    correctness: ">= 75"
    completeness: ">= 80"
    utility: ">= 85"
    risk: "<= 30"
    token_efficiency: ">= 70"
    confidence: ">= 80"
```

---

## Workflow 2: Code Review

**Intent**: Review a code change for bugs, risks, and improvement opportunities.

```yaml
workflow:
  name: code_review
  intent_type: review
  complexity: high
  risk_level: medium

  sequence:
    - intent_router
    - context_broker
    - constraint_resolver
    - reasoning_engine
    - risk_scanner
    - validation_engine
    - scoring_engine
    - delivery_formatter

  sample_input:
    objective: "Review pull request for security issues and code quality"
    context:
      diff: "<code diff>"
      language: "python"
      standards: "PEP 8, OWASP Top 10"
      architecture: "microservices, REST API"

  acceptance_criteria:
    - "Security vulnerabilities identified with severity"
    - "Logic errors flagged with explanation"
    - "Style issues noted but not over-weighted"
    - "Positive patterns acknowledged"
    - "Each finding has a specific fix suggestion"
    - "Findings prioritized by impact"

  expected_scores:
    correctness: ">= 80"
    completeness: ">= 75"
    utility: ">= 85"
    risk: "<= 40"
    token_efficiency: ">= 60"
    confidence: ">= 75"
```

