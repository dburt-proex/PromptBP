## Workflow 3: Research

**Intent**: Investigate a topic and produce a structured evidence-based summary.

```yaml
workflow:
  name: research_investigation
  intent_type: research
  complexity: high
  risk_level: low

  sequence:
    - intent_router
    - context_broker
    - research_retrieval
    - reasoning_engine
    - compression_engine
    - scoring_engine
    - delivery_formatter

  sample_input:
    objective: "Research current state of LLM evaluation frameworks"
    context:
      scope: "Open-source frameworks released in 2025-2026"
      depth: "Feature comparison, strengths, weaknesses"
      output_need: "Decision support for choosing a framework"

  acceptance_criteria:
    - "Minimum 5 frameworks covered"
    - "Each framework has: name, purpose, strengths, weaknesses, maturity"
    - "Comparison table included"
    - "Recommendation with rationale provided"
    - "Sources cited for claims"
    - "Limitations of research stated"

  expected_scores:
    correctness: ">= 70"
    completeness: ">= 80"
    utility: ">= 85"
    risk: "<= 20"
    token_efficiency: ">= 65"
    confidence: ">= 65"
```

