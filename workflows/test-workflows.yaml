## Workflow 4: System Build

**Intent**: Design and generate a system component from specifications.

```yaml
workflow:
  name: system_build
  intent_type: build
  complexity: high
  risk_level: high

  sequence:
    - intent_router
    - context_broker
    - constraint_resolver
    - research_retrieval
    - builder_generator
    - risk_scanner
    - simulation_layer
    - validation_engine
    - scoring_engine
    - delivery_formatter

  sample_input:
    objective: "Design a rate limiting middleware for the API gateway"
    context:
      tech_stack: "Node.js, Express, Redis"
      requirements:
        - "100 req/min per user"
        - "Sliding window algorithm"
        - "Graceful degradation"
        - "Distributed across 3 instances"
      constraints:
        - "< 5ms latency overhead"
        - "Must handle Redis failure gracefully"

  acceptance_criteria:
    - "Architecture diagram or description provided"
    - "Implementation code is functional"
    - "Edge cases documented"
    - "Failure modes identified with fallbacks"
    - "Performance characteristics stated"
    - "Deployment notes included"

  expected_scores:
    correctness: ">= 80"
    completeness: ">= 80"
    utility: ">= 90"
    risk: "<= 50"
    token_efficiency: ">= 55"
    confidence: ">= 75"
```

